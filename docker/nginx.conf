server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # The modules are many small text files; they compress well.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # The modules have no content hash in their names, so the browser keeps
    # them but asks on every load (a 304 when nothing changed): a new deploy
    # shows up at once instead of mixing old and new modules.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # WebXR (the Quest mode) on this origin.
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    }

    # The exterior image is versioned in its name (-v1) and 2 MB.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # For the container's healthcheck and the proxy in front of it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
